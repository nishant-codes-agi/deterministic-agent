services:
  app:
    build: .
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src"]
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./runs:/app/runs
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - agent-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - agent-net

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: deterministic_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d deterministic_agent"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net

volumes:
  pgdata:

networks:
  agent-net:
    driver: bridge
